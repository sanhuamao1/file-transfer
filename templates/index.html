<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Codelink · 文件中转站</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet">
</head>
<body>

<!-- Lock Screen -->
<div id="lockScreen" class="screen active">
  <div class="card lock-card">
    <div class="logo">
      <div class="logo-icon">&#9919;</div>
      <h1>Codelink</h1>
      <p class="subtitle">文件中转站</p>
    </div>
    <p class="desc">输入取件码以访问文件</p>
    <form id="lockForm" autocomplete="off">
      <div class="input-group">
        <input type="password" id="codeInput" placeholder="取件码" maxlength="16" autofocus>
        <button type="submit" id="unlockBtn">&#10132;</button>
      </div>
      <p id="lockError" class="error-msg"></p>
    </form>
  </div>
</div>

<!-- Main App -->
<div id="mainScreen" class="screen">

  <!-- Top Bar -->
  <header>
    <div class="header-inner">
      <div class="logo-row">
        <div class="logo-icon sm">&#9919;</div>
        <span class="brand">Codelink</span>
      </div>
      <button id="lockBtn" class="btn-icon" title="锁屏">&#128274;</button>
    </div>
  </header>

  <main>
    <!-- Upload / Delete Zone -->
    <div class="card" id="dropZone">
      <div class="upload-icon">&#128228;</div>
      <div class="delete-icon"><i class="fa-regular fa-trash-can"></i></div>
      <p class="upload-text">拖拽文件到此处，或点击选择</p>
      <p class="delete-text">松开删除文件</p>
      <p class="upload-hint">最大 50MB</p>
      <input type="file" id="fileInput" hidden>
      <div id="uploadProgress" class="progress hidden">
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <span id="progressText">上传中…</span>
      </div>
    </div>

    <!-- File List -->
    <div class="card list-card">
      <div class="list-header">
        <h2>文件列表</h2>
        <span id="fileCount" class="badge">0</span>
      </div>
      <div id="fileList">
        <div class="empty-state">
          <span class="empty-icon">&#128196;</span>
          <p>暂无文件</p>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Toast -->
<div id="toast" class="toast hidden"></div>

<script>
const ACCESS_CODE = null; // filled after unlock

// --- Lock ---
document.getElementById('lockForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const code = document.getElementById('codeInput').value;
  const btn = document.getElementById('unlockBtn');
  btn.disabled = true;
  btn.textContent = '…';
  document.getElementById('lockError').textContent = '';

  try {
    const res = await fetch('/api/verify', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({code})
    });
    const data = await res.json();
    if (data.ok) {
      window.__CODE__ = code;
      showMain();
    } else {
      document.getElementById('lockError').textContent = '取件码错误';
      btn.disabled = false;
      btn.textContent = '\u27A4';
    }
  } catch {
    document.getElementById('lockError').textContent = '连接失败';
    btn.disabled = false;
    btn.textContent = '\u27A4';
  }
});

// Allow enter key to retry
document.getElementById('codeInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    document.getElementById('lockForm').requestSubmit();
  }
});

function showMain() {
  document.getElementById('lockScreen').classList.remove('active');
  document.getElementById('mainScreen').classList.add('active');
  loadFiles();
}

// --- Lock button ---
document.getElementById('lockBtn').addEventListener('click', () => {
  window.__CODE__ = null;
  document.getElementById('mainScreen').classList.remove('active');
  document.getElementById('lockScreen').classList.add('active');
  document.getElementById('codeInput').value = '';
  document.getElementById('codeInput').focus();
});

// --- Toast ---
function toast(msg, type = 'success') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show';
  el.style.background = type === 'error' ? '#ef4444' : '#10b981';
  setTimeout(() => el.classList.remove('show'), 2500);
}

// --- Upload / Delete Zone ---
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');

let dragFileId = null;

dropZone.addEventListener('click', () => {
  if (!dropZone.classList.contains('delete-mode')) fileInput.click();
});

dropZone.addEventListener('dragover', (e) => {
  e.preventDefault();
  if (dragFileId) {
    dropZone.classList.add('delete-mode');
  } else {
    dropZone.classList.add('drag-over');
  }
});
dropZone.addEventListener('dragleave', () => {
  dropZone.classList.remove('drag-over', 'delete-mode');
});
dropZone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropZone.classList.remove('drag-over', 'delete-mode');
  if (dragFileId) {
    deleteFile(dragFileId);
    dragFileId = null;
  } else if (e.dataTransfer.files.length) {
    uploadFile(e.dataTransfer.files[0]);
  }
});

fileInput.addEventListener('change', () => {
  if (fileInput.files.length) uploadFile(fileInput.files[0]);
  fileInput.value = '';
});

async function uploadFile(file) {
  const prog = document.getElementById('uploadProgress');
  const fill = document.getElementById('progressFill');
  const txt = document.getElementById('progressText');
  prog.classList.remove('hidden');
  fill.style.width = '0%';
  txt.textContent = `${file.name} 上传中…`;

  try {
    const form = new FormData();
    form.append('file', file);
    // use XHR for progress
    const xhr = new XMLHttpRequest();
    xhr.open('POST', '/api/upload');
    xhr.setRequestHeader('X-Access-Code', window.__CODE__);
    xhr.upload.onprogress = (e) => {
      if (e.lengthComputable) fill.style.width = (e.loaded / e.total * 100) + '%';
    };
    await new Promise((resolve, reject) => {
      xhr.onload = () => {
        if (xhr.status === 200) resolve();
        else reject(new Error(xhr.responseText));
      };
      xhr.onerror = reject;
      xhr.send(form);
    });
    prog.classList.add('hidden');
    toast('上传成功');
    loadFiles();
  } catch (err) {
    prog.classList.add('hidden');
    let msg = '上传失败';
    try { const d = JSON.parse(err.message); msg = d.error || msg; } catch {}
    toast(msg, 'error');
  }
}

function getFileIcon(name) {
  const ext = name.split('.').pop().toLowerCase();
  if (/^(png|jpg|jpeg|gif|webp|svg|bmp|ico)$/.test(ext)) return 'fa-file-image';
  if (/^(mp4|avi|mov|mkv|webm|flv)$/.test(ext)) return 'fa-file-video';
  if (/^(mp3|wav|ogg|flac|aac|m4a)$/.test(ext)) return 'fa-file-audio';
  if (/^(pdf)$/.test(ext)) return 'fa-file-pdf';
  if (/^(doc|docx|xls|xlsx|ppt|pptx)$/.test(ext)) return 'fa-file-lines';
  if (/^(zip|rar|7z|tar|gz|bz2|xz)$/.test(ext)) return 'fa-file-zipper';
  return 'fa-file-lines';
}

// --- Load files ---
async function loadFiles() {
  const list = document.getElementById('fileList');
  try {
    const res = await fetch('/api/files', {
      headers: {'X-Access-Code': window.__CODE__}
    });
    const data = await res.json();
    if (!data.ok) { toast('加载失败', 'error'); return; }
    document.getElementById('fileCount').textContent = data.files.length;
    if (!data.files.length) {
      list.innerHTML = '<div class="empty-state"><span class="empty-icon">📄</span><p>暂无文件</p></div>';
      return;
    }
    list.innerHTML = '<div class="file-grid">' + data.files.map(f => {
      const size = f.size > 1024*1024
        ? (f.size/1024/1024).toFixed(1) + ' MB'
        : (f.size/1024).toFixed(0) + ' KB';
      return `<div class="file-card" draggable="true" data-id="${f.id}">
        <div class="file-icon"><i class="fa-regular ${getFileIcon(f.name)}"></i></div>
        <div class="file-name" title="${escHtml(f.name)}">${escHtml(f.name)}</div>
        <div class="file-meta">${f.time} · ${size}</div>
        <div class="file-dl-overlay"><i class="fa-solid fa-download"></i></div>
      </div>`;
    }).join('') + '</div>';
    // drag & download handlers
    document.querySelectorAll('.file-card').forEach(card => {
      const id = card.dataset.id;
      card.addEventListener('click', () => {
        const a = document.createElement('a');
        a.href = '/api/file/' + id + '?code=' + encodeURIComponent(window.__CODE__);
        a.download = '';
        a.click();
      });
      card.addEventListener('dragstart', (e) => {
        dragFileId = id;
        e.dataTransfer.effectAllowed = 'move';
      });
      card.addEventListener('dragend', () => {
        dragFileId = null;
        dropZone.classList.remove('delete-mode');
      });
    });
}

function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// --- Delete ---
async function deleteFile(id) {
  try {
    const res = await fetch(`/api/file/${id}`, {
      method: 'DELETE',
      headers: {'X-Access-Code': window.__CODE__}
    });
    const data = await res.json();
    if (data.ok) { toast('已删除'); loadFiles(); }
    else toast('删除失败', 'error');
  } catch { toast('删除失败', 'error'); }
}
</script>
</body>
</html>
